plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}


android {
    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword '457BWY4z'
            storeFile file('/Users/sergei/doramatv_key')
            storePassword '457BWY4z'
        }
    }


    compileSdkVersion 31
    defaultConfig {
        applicationId "ru.garretech.garred.doramatv"
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 51
        versionName "1.7.1"

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        signingConfig signingConfigs.config
    }
    buildTypes {
        debug {
            ext.enableCrashlytics = false
        }

        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    productFlavors {
    }
    buildToolsVersion '30.0.3'
    compileOptions {
        sourceCompatibility = '1.17'
        targetCompatibility = '1.17'
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.20'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.browser:browser:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    // Last version that supports android 4.4
    implementation("com.squareup.okhttp3:okhttp:3.12.2") {
        force = true //API 19 support
    }

    implementation 'org.jsoup:jsoup:1.13.1'

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'androidx.room:room-runtime:2.4.3'
    implementation 'androidx.room:room-rxjava2:2.4.3'
    kapt 'androidx.room:room-compiler:2.4.3'
    annotationProcessor 'androidx.room:room-compiler:2.4.3'

    implementation 'com.google.code.gson:gson:2.8.7'


    implementation 'com.yandex.android:mobileads:5.3.1'
    implementation 'com.yandex.android:mobmetricalib:5.0.0'
//    implementation 'com.yandex.ads.mediation:mobileads-admob:21.2.0.0'
//    implementation 'com.google.android.gms:play-services-ads:21.1.0@aar'


    // Firebase + Crashlytics
    // Recommended: Add the Firebase SDK for Google Analytics.
    implementation 'com.google.firebase:firebase-analytics-ktx:21.1.1'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.2.13'
    implementation 'com.google.firebase:firebase-config-ktx:21.1.2'

    implementation 'com.github.bumptech.glide:glide:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
}
repositories {
    mavenCentral()
}
