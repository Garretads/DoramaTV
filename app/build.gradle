apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'io.fabric'



android {
    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword '457BWY4z'
            storeFile file('/Users/sergej/doramatv_key')
            storePassword '457BWY4z'
        }
    }

    // Добавил рекламу ( В ПРОЦЕССЕ)
    // Применил ConstraintsLayout на активности с описанием приложения
    compileSdkVersion 28
    defaultConfig {
        applicationId "ru.garretech.garred.doramatv"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 30
        versionName "1.4.8"
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        signingConfig signingConfigs.config
    }
    buildTypes {
        debug {
            ext.enableCrashlytics = false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    productFlavors {
    }
    buildToolsVersion '28.0.3'
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}


ext {
    archComponentsVersion = "1.1.1"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:multidex:1.0.3'

    implementation "com.android.support:design:28.0.0"
    implementation "com.android.support:customtabs:28.0.0"
    implementation "com.android.support:recyclerview-v7:28.0.0"
    implementation "com.android.support.constraint:constraint-layout:1.1.3"

    implementation "android.arch.persistence.room:runtime:$archComponentsVersion"
    implementation "android.arch.persistence.room:rxjava2:$archComponentsVersion"

    implementation 'com.squareup.okhttp3:okhttp:3.11.0'

    implementation 'org.jsoup:jsoup:1.11.3'

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.8'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    kapt "android.arch.persistence.room:compiler:$archComponentsVersion"
    annotationProcessor "android.arch.persistence.room:compiler:$archComponentsVersion"

    debugImplementation 'im.dino:dbinspector:3.4.1@aar'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'com.yandex.android:mobileads:2.91'
    implementation 'com.yandex.android:mobmetricalib:3.5.3'
    implementation 'com.yandex.ads.mediation:mobileads-admob:1.4.0'


    implementation('com.crashlytics.sdk.android:crashlytics:2.9.9@aar') {
        transitive = true;
    }

    testImplementation 'junit:junit:4.12'
}
repositories {
    mavenCentral()
    maven { url 'https://maven.fabric.io/public' }
}
